services:
  # FastAPI 웹 서버
  # 영상 생성은 별도 서비스(aivle-team03/AI 의 videoagent)가 담당한다.
  # VIDEO_AGENT_URL 로 그 서비스를 가리켜야 한다.
  web:
    build: .
    container_name: boss_fastapi
    ports:
      - "8000:8000"
    env_file:
      - .env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    volumes:
      - ./static:/app/static # 게시판·체크리스트·조치이력 업로드 이미지 서빙
